# Uncomment version only if using legacy VM
# version: '2.3'

# Production. The platform's setup command is
#   docker-compose -f docker-compose.yml -f docker-compose.deployment.yml build && ... up
# with the images below rewritten by CI, AND docker-compose.override.yml is
# applied at launch as well (DLI brief 1.5, Dana, Feb 26 2026; BUILD.md P9).
# Compose merges volumes by container path and this file is merged last, so a
# named volume declared here replaces the override's bind mount on the same
# path; a path the override alone names keeps its bind mount and must then
# exist in the launch tarball (.launchignore). The two named volumes below are
# the V1 house pattern for exactly this reason.

volumes:
  # Learner-visible content (/dli/task), seeded from the lab image on first
  # mount and shared with course-prep (reads part1/course_setup.py and
  # search-videos.json) and assessment (reads the learner's answers under
  # work/assessment/). Replaces the override's ./lab/task bind mount; without
  # it the grader could not see learner artefacts.
  task:
  # The grader (/dli/assessment: runner, tasktest.py, grader/ with the answer
  # keys), seeded from the assessment image on first mount. Replaces the
  # override's ./assessment bind mount, so assessment/ stays out of the
  # tarball and the keys never land on the VM's disk.
  assessment:

services:

  lab:
    # In production we need to pull down an image from a CSP-specific container
    # repository. This value is a placeholder, and is replaced by automated builds.
    image: <placeholder>
    volumes:
      - task:/dli/task

  dind:
    image: <placeholder>

  vss-deploy:
    image: <placeholder>
    # Contains variables managed by GitLab secrets manager, provided in file by platform allocator via CD pipeline.
    env_file: /dli/secrets/.env

  course-prep:
    # Same Dockerfile as lab (see the override). VERIFY ON DEVBOX / CI: the
    # name CI gives this third image. The script runs from the image's
    # /dli/prep; this volume replaces the override's ./lab/task bind, so no
    # bind mount survives under /dli and course-prep reads the same
    # /dli/task as the lab.
    image: <placeholder>
    volumes:
      - task:/dli/task

  assessment:
    # Built from Dockerfile.assessment (its own file; the builder ignores `target`); CI names it <course>-task1-assessment:build (V1 convention).
    image: c-fx-17-v2-task1-assessment:build
    volumes:
      - task:/dli/task
      - assessment:/dli/assessment
    ports:
      # The LMS calls the assessment runner on 8080.
      - 8080:8080

  nginx:
    # In production, nginx should be accessible via port `80`.
    ports:
      - 80:80
