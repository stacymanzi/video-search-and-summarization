# VSS 3.x network prerequisites, applied inside dind's PRIVATE network namespace.
#
# Upstream documents these as HOST sysctls requiring root:
#   https://docs.nvidia.com/vss/3.0.0/vssnext-docs/latest/prerequisites.html
#
# Because this container owns its network namespace, they apply here and nowhere
# else. That is the point of the design: it converts "root on the DLI course VM"
# into "root in a container we own."
#
# Applied by entrypoint.sh with `sysctl -p`. Failures are logged, not fatal:
# net.core.* namespacing varies by kernel, and the buffer tuning is a throughput
# optimisation rather than a correctness requirement at course scale.
#
# ---------------------------------------------------------------------------
# DELIBERATELY OMITTED: the three IPv6 disables that upstream lists
#
#   net.ipv6.conf.all.disable_ipv6     = 1
#   net.ipv6.conf.default.disable_ipv6 = 1
#   net.ipv6.conf.lo.disable_ipv6      = 1
#
# Those are safe on a bare host but harmful here. VSS's own ingress chain
# (nginx :30888 -> envoy :10000 -> backend :30001) resolves "localhost" via a
# container /etc/hosts that maps BOTH 127.0.0.1 and ::1. Envoy tries ::1 first.
# With IPv6 disabled on lo there is no ::1 to bind, and every request fails:
#
#   upstream connect error ... immediate connect error:
#   Cannot assign requested address | remote address:[::1]:30001
#
# Keeping ::1 available costs nothing inside a private namespace and matches the
# configuration this stack was actually verified against. Do not "restore" these
# lines to match the upstream docs without re-testing /vst/api/* end to end.
#
# (Note: disabling IPv6 was NOT the root cause of the VIOS 503; that was
# --host-ip localhost, see deploy/deploy-vss.sh. But it is a second, independent
# way to break the same path, so it stays out.)
# ---------------------------------------------------------------------------

net.core.rmem_max = 5242880
net.core.wmem_max = 5242880
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
