# NOTE ON SECRETS: no service below names a secret in `environment:`. A bare
# `- SOME_KEY` entry is resolved from the *shell* running docker compose, and
# `environment:` outranks `env_file:`, so an unset shell variable silently
# overwrites any value with an empty string. The NGC key is never passed to
# these services; setup.sh consumes it on the host before `docker compose up`.

volumes:
  # Course assets (videos, ground_truth, course-docs stub) staged by setup.sh.
  # Also holds course-prep's search_sources.json and status files.
  course_data:
  # Grader marker (/dli/assessment_results/part1.json). Written only by the
  # assessment service; the lab mounts it read-only so a learner kernel cannot
  # forge a pass.
  assessment_results:

services:
  # JupyterLab with the Part 1 notebooks and assessment.
  # Mounts the host Docker socket so notebook 1 can run `docker ps`, `docker
  # inspect` and `docker exec kafka ...` against the VSS containers that
  # dev-profile.sh started on the host daemon.
  lab:
    runtime: nvidia
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - course_data:/dli/task/data
      - assessment_results:/dli/assessment_results:ro
      # Full upstream blueprint checkout. Notebooks read generated.env,
      # compose configs and the deployer's seed-status/_course-runtime/.
      # Same path as on the host so any absolute paths in configs resolve.
      - /opt/vss:/opt/vss:ro
      # Host Docker socket: notebooks run docker commands against the VSS
      # containers that live on the host daemon (not inside dind).
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - NGC_CLI_ORG=${NGC_CLI_ORG:-nvidia}
      - VSS_PROFILE=${VSS_PROFILE:-search}
      # Both GPUs must be visible: notebook 1 (section 1.4) runs nvidia-smi and
      # expects both. Learner kernels are constrained with CUDA_VISIBLE_DEVICES.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=${LAB_DEVICE_ID:-0}
      # VSS services run with network_mode: host on the host daemon, so they
      # are reachable from this bridge-network container via host.docker.internal.
      # Prefixed COURSE_* to avoid leaking into any sub-process that also reads
      # the upstream VSS env variable names (e.g. dev-profile.sh run from a
      # notebook terminal).
      - VSS_PUBLIC_PORT=${VSS_PUBLIC_PORT:-80}
      - COURSE_LLM_BASE_URL=http://host.docker.internal:30081
      - COURSE_VIOS_BASE_URL=http://host.docker.internal:30888/vst/api
      - COURSE_ELK_BASE_URL=http://host.docker.internal:9200
      - COURSE_RTVI_CV_BASE_URL=http://host.docker.internal:9002
      - COURSE_RTVI_EMBED_BASE_URL=http://host.docker.internal:8017
      - COURSE_RTVI_VLM_BASE_URL=http://host.docker.internal:${VSS_RT_VLM_PORT:-8018}
      - COURSE_AGENT_BASE_URL=http://host.docker.internal:8000
      - JUPYTER_TOKEN
      # On Brev the platform provides a "dind" hostname whose IPv4 address
      # becomes HOST_IP (used by notebooks to reach VSS APIs). On a devbox
      # there is no dind service; host.docker.internal (host-gateway) works
      # the same way since VSS services listen on 0.0.0.0.
      - DLI_DIND_HOSTNAME=${DLI_DIND_HOSTNAME:-host.docker.internal}

  # One-shot: waits for VSS health, ingests the four search clips through
  # http://nginx/agent/..., writes search_sources.json and course_prep_status.json.
  # No GPU, no NGC key, no Docker socket.
  course-prep:
    entrypoint: ["python3", "/dli/prep/prepare_course.py"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - COURSE_PREP_HEALTH_TIMEOUT_S=${COURSE_PREP_HEALTH_TIMEOUT_S:-5400}
      - COURSE_PREP_EMBED_TIMEOUT_S=${COURSE_PREP_EMBED_TIMEOUT_S:-1800}
      - COURSE_DATA_TIMEOUT_S=${COURSE_DATA_TIMEOUT_S:-5400}
    volumes:
      - course_data:/dli/task/data
      # seed-status and seed.log for deploy progress reporting.
      - /opt/vss:/opt/vss:ro
    depends_on:
      nginx:
        condition: service_started
    restart: "no"

  # Grader: Go runner on 8080 (called by the LMS) + Python grader on 8081
  # (called by the assessment notebook's Submit cell).
  assessment:
    entrypoint: /dli/entrypoint.assessment.sh
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - assessment_results:/dli/assessment_results
      # Read-only: the T5 grader check reads search_sources.json here.
      - course_data:/dli/task/data:ro
    restart: unless-stopped

  # Reverse proxy on port 80. Serves JupyterLab, the course bar, and all
  # student-facing VSS endpoints. VSS services run with network_mode: host on
  # the host daemon; nginx reaches them via host.docker.internal.
  nginx:
    image: nginx:1.15.12-alpine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - lab
