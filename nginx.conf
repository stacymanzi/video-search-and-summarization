# (1) We use this file to configure the nginx reverse proxy required for each course.
worker_processes auto;
pid /etc/nginx/.nginx.pid;

events {
	worker_connections 768;
}

http {
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	client_max_body_size 0;
	keepalive_timeout 65;
	types_hash_max_size 2048;

	default_type application/octet-stream;

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2; # Dropping SSLv3, ref: POODLE
		ssl_prefer_server_ciphers on;

	access_log /var/log/access.log;
	error_log /var/log/error.log;

	gzip on;
	gzip_disable "msie6";

	# Ingest and captioning can run for minutes on a long clip. Do not let the
	# proxy time out before the backend answers.
	proxy_read_timeout 900s;
	proxy_send_timeout 900s;
	proxy_connect_timeout 60s;

	# Resolve service names at request time rather than at startup, so nginx
	# still boots if dind is not yet listening.
	resolver 127.0.0.11 valid=10s ipv6=off;

	server {

		listen 80 default_server;
		listen [::]:80 default_server;

		# common directives
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# INHERITANCE TRAP: a location with ONE proxy_set_header of its own
		# inherits NONE of the four above. /lab repeats them (it needs a fifth,
		# see there; tests/test_lab_home.py pins the mirror); /dashboard/ and
		# /rtvi-vlm/ already have their own and so never had these.
		proxy_buffering off;

		# (2) Redirect root path access to the endpoint serving up the content.
		# NOTE the `=`: an EXACT match on "/" only. There is deliberately no
		# catch-all `location /` in this file: a path nobody claims below is
		# answered 404 by nginx itself, which is the honest answer. (The Berlin
		# course forwarded the unclaimed namespace to the VSS UI on dind:7777;
		# course 1 never opens that UI, so the route and its Host/Upgrade
		# plumbing are gone.)
		location = / {
			proxy_pass http://localhost/lab;
		}

		location /lab {
			# Variable upstream: re-resolved through the resolver above, so a recreated
			# lab container (new IP) keeps working without an nginx restart.
			set $lab http://lab:8888;
			proxy_pass $lab;
			# The course bar (lab/task/lab_home.py). Every JupyterLab page gets one
			# <script> before </head>, served by the lab's status server through
			# jupyter-server-proxy, so the bar is drawn on first load without a
			# cell. Only text/html bodies are touched (sub_filter_types default);
			# JSON, JS, images and websockets pass unchanged. The script does
			# nothing inside an iframe or on a page without the JupyterLab shell
			# (the login page, Course Docs). sub_filter cannot see </head> inside a
			# gzip stream, so this location asks Jupyter for a plain body; that
			# fifth header is why the server-level four are repeated here (the
			# trap above). Keep the five in step with the server block. This file
			# is a single-file bind mount: a pull replaces the inode, so a restart
			# or reload still reads the OLD file. Check the working-tree file, then
			# recreate: docker run --rm -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro"
			# nginx:1.15.12-alpine nginx -t && docker-compose up -d --force-recreate
			# --no-deps nginx
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "Upgrade";
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header Accept-Encoding "";
			sub_filter '</head>' '<script defer src="/lab/proxy/8050/bar.js"></script></head>';
			sub_filter_once on;
		}

		# The dashboard that the coding agent can build in the optional task of
		# VSS Coding Agent Skills (the Course Docs page
		# docs/course/vss-coding-agent-skills.md): dashboard/app.py, a starter
		# page the coding agent rewrites, serves on 6006 inside the lab
		# container, which is already exposed. Learners open it at
		# http://<lab-host>/dashboard/.
		location /dashboard/ {
			# Variable upstream (see /lab). With a variable, nginx does not strip the
			# location prefix, so the rewrite does it, and the app can be written as
			# if it were mounted at /. `set` comes BEFORE `rewrite ... break` (rule 2
			# in section (3) below): placed after it, `set` never runs, $dash stays
			# empty and every request fails with 500 "invalid URL prefix".
			set $dash http://lab:6006;
			rewrite ^/dashboard/(.*)$ /$1 break;
			proxy_pass $dash;
			proxy_set_header Host $host;
			# The app is restarted by hand while it is rewritten; failing fast
			# beats a 60s hang when it happens to be down between edits.
			proxy_connect_timeout 5s;
		}

		# (3) VSS services. These run inside dind's private network namespace, so
		# proxying them here means nothing is published on the course VM's NIC and
		# everything a learner needs is reachable on :80, including from a
		# restricted corporate network. Notebooks use these paths (CONTRACTS.md
		# section 1), never dind:<port> directly.
		#
		# Two ordering rules here, both learned the hard way:
		#
		# 1. `rewrite ... break` is REQUIRED. proxy_pass with a VARIABLE upstream
		#    does not strip the location prefix, so without it the VSS agent
		#    service receives /agent/health instead of /health and returns 404.
		# 2. `set` MUST come BEFORE `rewrite ... break`. Both run in the rewrite
		#    phase, and `break` halts that phase, so a `set` placed after it never
		#    executes, leaving the variable empty and every request failing 500
		#    with "invalid URL prefix in \"\"".
		#
		# The variable is itself required so nginx resolves `dind` at request time
		# rather than refusing to start when dind is not yet up.
		#
		# Only the routes course 1 uses are here (BUILD.md P8). The search
		# profile also runs a Nemotron LLM NIM (30081) and the VSS ingress
		# (7777); neither is reachable through this proxy on purpose.

		location /vios/ {                     # VIOS / VST: video storage, timelines, clip export
			set $vios http://dind:30888;
			rewrite ^/vios/(.*)$ /$1 break;
			proxy_pass $vios;
		}

		location /es/ {                     # Elasticsearch: all mdx-* and default_* indices
			set $es http://dind:9200;
			rewrite ^/es/(.*)$ /$1 break;
			proxy_pass $es;
		}

		# --- The three perception services --------------------------------------
		# Exposed INDIVIDUALLY on purpose. The point of the course is comparing
		# how RT-CV, RT-VLM and RT-Embed each extract metadata from the same
		# clip, which means reaching each one's own API, not just the aggregate
		# agent. Each also serves /v1/models or /api/v1/ready, so a notebook can
		# confirm which model is actually loaded.

		location /rtvi-cv/ {                # RT-CV: DeepStream TrafficCamNet RT-DETR detection + tracking
			set $rtvicv http://dind:9000;
			rewrite ^/rtvi-cv/(.*)$ /$1 break;
			proxy_pass $rtvicv;
		}

		location /rtvi-embed/ {             # RT-Embed: Cosmos-Embed1, 768-d chunk embeddings
			set $rtviembed http://dind:8017;
			rewrite ^/rtvi-embed/(.*)$ /$1 break;
			proxy_pass $rtviembed;
		}

		# Captioning and chat/completions are driven by hand from a notebook, and
		# a long clip can hold the connection open well past nginx's 60s default
		# while Cosmos 3 Super Reasoner works through the chunks. The generous
		# timeouts and disabled buffering are what make `"stream": true` (SSE)
		# usable through this proxy.
		location /rtvi-vlm/ {               # RT-VLM (Cosmos 3 Super Reasoner): /v1/files, /v1/generate_captions, /v1/chat/completions
			set $rtvivlm http://dind:8018;
			rewrite ^/rtvi-vlm/(.*)$ /$1 break;
			proxy_pass $rtvivlm;
			proxy_set_header Connection "";
			proxy_buffering off;
			proxy_cache off;
			proxy_read_timeout 3600s;
			proxy_send_timeout 3600s;
		}

		location /agent/ {                  # VSS agent: ingest + embed_search
			set $agent http://dind:8000;
			rewrite ^/agent/(.*)$ /$1 break;
			proxy_pass $agent;
			proxy_read_timeout 900s;        # /videos/{id}/complete fans out to RT-CV and RT-Embed
			proxy_send_timeout 900s;
		}

		# Port 31000 serves BOTH the VIOS web UI and the NVStreamer API that loops
		# an uploaded MP4 as an RTSP feed (used only by the optional live-stream
		# part of notebook 2, section 2.13, and an optional coding-agent task).
		# Two paths reach it, because the name you want depends on which one you
		# are after:
		#
		#   /vios-ui/     the browser UI  (what a learner opens to play a clip)
		#   /nvstreamer/  the same thing, kept because the live-stream cells and
		#                 the existing tests call it by this name
		#
		# Only the HTTP/upload API is proxied; the RTSP it serves on 31554 is a
		# different protocol and is consumed INSIDE dind by RT-CV and RT-VLM, so
		# it never needs to cross this proxy. The UI's assets are relative
		# (./assets/js/...), so they resolve under either prefix without
		# rewriting the HTML.
		location /vios-ui/ {                # VIOS web UI: browse and play stored video
			set $viosui http://dind:31000;
			rewrite ^/vios-ui/(.*)$ /$1 break;
			proxy_pass $viosui;
			client_max_body_size 0;
			proxy_request_buffering off;
			proxy_read_timeout 900s;
			proxy_send_timeout 900s;
		}

		location /nvstreamer/ {             # same service: NVStreamer file-to-RTSP API
			set $nvstreamer http://dind:31000;
			rewrite ^/nvstreamer/(.*)$ /$1 break;
			proxy_pass $nvstreamer;
			client_max_body_size 0;         # video uploads; do not buffer-limit
			proxy_request_buffering off;
			proxy_read_timeout 900s;
			proxy_send_timeout 900s;
		}

		location /kibana/ {                 # Kibana: index browsing
			set $kibana http://dind:5601;
			proxy_pass $kibana;             # NOTE: no rewrite, because server.basePath is /kibana
		}
	}
}
