worker_processes auto;
pid /etc/nginx/.nginx.pid;

events {
	worker_connections 768;
}

http {
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	client_max_body_size 0;
	keepalive_timeout 65;
	types_hash_max_size 2048;

	default_type application/octet-stream;

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
		ssl_prefer_server_ciphers on;

	access_log /var/log/access.log;
	error_log /var/log/error.log;

	gzip on;
	gzip_disable "msie6";

	# Ingest and captioning can run for minutes on a long clip. Do not let the
	# proxy time out before the backend answers.
	proxy_read_timeout 900s;
	proxy_send_timeout 900s;
	proxy_connect_timeout 60s;

	# Resolve Docker service names (lab, assessment) at request time rather than
	# startup, so nginx boots even if those containers are not yet running.
	# host.docker.internal (the VSS services on the host daemon) is in /etc/hosts
	# via extra_hosts and does not need DNS resolution.
	resolver 127.0.0.11 valid=10s ipv6=off;

	server {

		listen 80 default_server;
		listen [::]:80 default_server;

		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_buffering off;

		# Redirect root to JupyterLab.
		location = / {
			proxy_pass http://localhost/lab;
		}

		location /lab {
			# Variable upstream: re-resolved at request time so a recreated lab
			# container (new IP) works without an nginx restart.
			set $lab http://lab:8888;
			proxy_pass $lab;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "Upgrade";
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header Accept-Encoding "";
			# Course bar: inject before </head> on every JupyterLab text/html page.
			# Requires Accept-Encoding: "" so nginx sees an uncompressed body.
			sub_filter '</head>' '<script defer src="/lab/proxy/8050/bar.js"></script></head>';
			sub_filter_once on;
		}

		# Optional coding-agent dashboard (dashboard/app.py, served on 6006).
		location /dashboard/ {
			set $dash http://lab:6006;
			rewrite ^/dashboard/(.*)$ /$1 break;
			proxy_pass $dash;
			proxy_set_header Host $host;
			proxy_connect_timeout 5s;
		}

		# VSS services — run with network_mode: host on the host daemon, so they
		# are reachable at host.docker.internal:<port> from this container.
		# Static proxy_pass (no variable) is correct here: host.docker.internal is
		# in /etc/hosts via extra_hosts and is always resolvable at startup.
		# Notebooks use these paths (not host:<port> directly).

		location /vios/ {
			rewrite ^/vios/(.*)$ /$1 break;
			proxy_pass http://host.docker.internal:30888;
		}

		location /es/ {
			rewrite ^/es/(.*)$ /$1 break;
			proxy_pass http://host.docker.internal:9200;
		}

		location /rtvi-cv/ {
			rewrite ^/rtvi-cv/(.*)$ /$1 break;
			proxy_pass http://host.docker.internal:9000;
		}

		location /rtvi-embed/ {
			rewrite ^/rtvi-embed/(.*)$ /$1 break;
			proxy_pass http://host.docker.internal:8017;
		}

		location /rtvi-vlm/ {
			rewrite ^/rtvi-vlm/(.*)$ /$1 break;
			proxy_pass http://host.docker.internal:8018;
			proxy_set_header Connection "";
			proxy_buffering off;
			proxy_cache off;
			proxy_read_timeout 3600s;
			proxy_send_timeout 3600s;
		}

		location /agent/ {
			rewrite ^/agent/(.*)$ /$1 break;
			proxy_pass http://host.docker.internal:8000;
			proxy_read_timeout 900s;
			proxy_send_timeout 900s;
		}

		location /vios-ui/ {
			rewrite ^/vios-ui/(.*)$ /$1 break;
			proxy_pass http://host.docker.internal:31000;
			client_max_body_size 0;
			proxy_request_buffering off;
			proxy_read_timeout 900s;
			proxy_send_timeout 900s;
		}

		location /nvstreamer/ {
			rewrite ^/nvstreamer/(.*)$ /$1 break;
			proxy_pass http://host.docker.internal:31000;
			client_max_body_size 0;
			proxy_request_buffering off;
			proxy_read_timeout 900s;
			proxy_send_timeout 900s;
		}

		location /kibana/ {
			proxy_pass http://host.docker.internal:5601;
		}
	}
}
